<!DOCTYPE html>
<html lang="vi">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giới thiệu - Nguyễn Đức Huy</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      color: #222;
      text-align: center;
      padding: 50px 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 450px;
      margin: auto;
      padding: 30px;
    }
    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 4px solid #74ebd5;
    }
    h1 {
      color: #333;
      font-size: 28px;
    }
    p {
      margin: 6px 0;
      font-size: 16px;
    }
    .social a {
      display: inline-block;
      margin: 8px;
      text-decoration: none;
      color: white;
      background: #0077ff;
      padding: 8px 16px;
      border-radius: 25px;
      transition: 0.3s;
    }
    .social a:hover {
      background: #005fcc;
    }
  </style>
</head>
<body>
